name: MidnightOil
options:
  bundleIdPrefix: app.midnightoil
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    DEVELOPMENT_TEAM: KPQU8X839X
    CODE_SIGN_STYLE: Automatic
    DEAD_CODE_STRIPPING: YES
packages:
  MidnightOilCore:
    path: Packages/MidnightOilCore
  MidnightOilTeams:
    path: ee/MidnightOilTeams
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: "2.4.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.10.0"
targets:
  MidnightOil:
    type: application
    platform: macOS
    sources:
      - MidnightOil
      - Shared
      - ee/App
      - path: LaunchDaemons
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    dependencies:
      - package: MidnightOilCore
      - package: MidnightOilTeams
      - package: KeyboardShortcuts
      - package: Sparkle
      - target: MidnightOilHelper
        copy:
          destination: executables
        codeSignOnCopy: true
    entitlements:
      path: MidnightOil/MidnightOil.entitlements
      properties:
        # The hardened runtime blocks Location Services without this, and macOS only
        # reveals the Wi-Fi network name to apps with Location access.
        com.apple.security.personal-information.location: true
    info:
      path: MidnightOil/Info.plist
      properties:
        CFBundleDisplayName: Midnight Oil
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: Copyright © 2026 Corey Haines. FSL-1.1-MIT.
        NSLocationUsageDescription: Midnight Oil needs your location to read the current Wi-Fi network name for Wi-Fi triggers.
        NSLocationWhenInUseUsageDescription: Midnight Oil needs your location to read the current Wi-Fi network name for Wi-Fi triggers.
        NSBluetoothAlwaysUsageDescription: Midnight Oil checks which Bluetooth devices are connected for Bluetooth triggers.
        SUFeedURL: https://github.com/coreyhaines31/midnightoil/releases/latest/download/appcast.xml
        SUPublicEDKey: 5MTMTktA0NUipG5n3iJy+27VbXN9uKgO2BbCgK8yUKU=
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_NAME: Midnight Oil
        PRODUCT_MODULE_NAME: MidnightOil
        PRODUCT_BUNDLE_IDENTIFIER: app.midnightoil.MidnightOil
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  MidnightOilHelper:
    type: tool
    platform: macOS
    sources: [MidnightOilHelper, Shared]
    settings:
      base:
        PRODUCT_NAME: MidnightOilHelper
        PRODUCT_BUNDLE_IDENTIFIER: app.midnightoil.MidnightOil.Helper
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
schemes:
  MidnightOil:
    build:
      targets:
        MidnightOil: all
    test:
      targets:
        - package: MidnightOilCore/MidnightOilCoreTests
        - package: MidnightOilTeams/MidnightOilTeamsTests
