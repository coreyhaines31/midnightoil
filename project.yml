name: MidnightOil
options:
  bundleIdPrefix: app.midnightoil
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    DEVELOPMENT_TEAM: KPQU8X839X
    CODE_SIGN_STYLE: Automatic
    DEAD_CODE_STRIPPING: YES
packages:
  MidnightOilCore:
    path: Packages/MidnightOilCore
targets:
  MidnightOil:
    type: application
    platform: macOS
    sources:
      - MidnightOil
      - Shared
      - path: LaunchDaemons
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    dependencies:
      - package: MidnightOilCore
      - target: MidnightOilHelper
        copy:
          destination: executables
        codeSignOnCopy: true
    info:
      path: MidnightOil/Info.plist
      properties:
        CFBundleDisplayName: Midnight Oil
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: Copyright © 2026 Corey Haines. MIT License.
        NSLocationUsageDescription: Midnight Oil needs your location to read the current Wi-Fi network name for Wi-Fi triggers.
        NSLocationWhenInUseUsageDescription: Midnight Oil needs your location to read the current Wi-Fi network name for Wi-Fi triggers.
        NSBluetoothAlwaysUsageDescription: Midnight Oil checks which Bluetooth devices are connected for Bluetooth triggers.
    settings:
      base:
        PRODUCT_NAME: Midnight Oil
        PRODUCT_MODULE_NAME: MidnightOil
        PRODUCT_BUNDLE_IDENTIFIER: app.midnightoil.MidnightOil
  MidnightOilHelper:
    type: tool
    platform: macOS
    sources: [MidnightOilHelper, Shared]
    settings:
      base:
        PRODUCT_NAME: MidnightOilHelper
        PRODUCT_BUNDLE_IDENTIFIER: app.midnightoil.MidnightOil.Helper
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
schemes:
  MidnightOil:
    build:
      targets:
        MidnightOil: all
    test:
      targets:
        - package: MidnightOilCore/MidnightOilCoreTests
